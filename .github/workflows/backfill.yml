# Completa los días de 2025 y 2026 de Instrumentos Operados en el repo privado MAV-datos,
# del más reciente al más viejo, con 5 minutos entre llamadas (la API exige 300 s).
# GitHub saltea muchas corridas programadas (el fin de semana del 03/10 corrió ~17 de ~60),
# así que cada corrida que sí arranca sigue de corrido hasta ~70 días (casi 6 h, el máximo
# de Actions) o hasta que empieza el horario de mercado. Mientras una corre, las siguientes
# quedan en espera (concurrency), nunca hay dos llamando al MAV a la vez. Cuando no falta ningún día, se desactiva sola:
# desde ahí el día a día lo guarda cierre_diario.yml (20 h, días hábiles).
# Corre fuera del horario de mercado para no chocar con las consultas desde la app:
# lun-vie de 18 a 9 h (hora argentina) y todo el día sábado y domingo.
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   MAV_USER, MAV_PASS, DATA_TOKEN (el token fine-grained de MAV-datos)
name: Backfill MAV

on:
  schedule:
    - cron: "0 0-11,21-23 * * *"   # 18:00-08:59 ART todos los días
    - cron: "0 12-20 * * 0,6"      # sábados y domingos de día
  workflow_dispatch:
    inputs:
      dias:
        description: "Cuántos días bajar en esta corrida (5 min entre cada uno; 60 días ≈ 5 h)"
        default: "60"
        required: true

permissions:
  contents: read
  actions: write   # para desactivar este workflow cuando la carga inicial termina

concurrency:
  group: backfill-mav
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # hasta ~70 días por corrida, dentro del máximo de 6 h de Actions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bajar días pendientes
        id: bf
        env:
          MAV_USER: ${{ secrets.MAV_USER }}
          MAV_PASS: ${{ secrets.MAV_PASS }}
          GITHUB_TOKEN: ${{ secrets.DATA_TOKEN }}
          GITHUB_DATA_REPO: IgnacioGarcia01/MAV-datos
          BACKFILL_DESDE: "2025-01-02"
          BACKFILL_DIAS: ${{ github.event.inputs.dias || '70' }}
          # Las programadas cortan a las 9 h de los días hábiles; la manual corre cuando la lances.
          BACKFILL_FUERA_DE_HORARIO: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python backfill.py
      - name: Desactivar la carga inicial (ya no faltan días)
        if: steps.bf.outputs.completo == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable backfill.yml --repo "$GITHUB_REPOSITORY"
